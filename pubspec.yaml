name: talent_tracker_ai
description: "Talent Tracker AI — Career Roadmap Platform for DIU"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase (Section 11 / 13.3) ---
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.16.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.0

  # --- State management & navigation ---
  # Note: the spec lists "riverpod ^2.5.0" — for a Flutter app the correct
  # package is flutter_riverpod (which depends on riverpod internally).
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0

  # --- Charts / Gantt (Section 13.3) ---
  fl_chart: ^0.66.0

  # --- Animations ---
  lottie: ^3.0.0

  # --- Export (FR-14, FR-19) ---
  pdf: ^3.10.0
  csv: ^5.1.0
  # 🔶 EXTENSION beyond Section 13.3's package table: S-16 (Roadmap PDF
  # Export) calls for a "PDF preview panel" and "Share options
  # (WhatsApp, Email, Google Drive)" — `pdf` alone generates bytes, it
  # doesn't preview or share them. `printing` provides both (a
  # PdfPreview widget + a built-in share sheet) and is the standard
  # companion package to `pdf` for exactly this use case.
  printing: ^5.11.0

  # --- Offline cache (NFR-14, FR-47) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # --- Utilities ---
  image_picker: ^1.0.0
  intl: ^0.19.0
  connectivity_plus: ^5.0.0
  dio: ^5.4.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  # 🔶 Bengali support (NFR-15) needs the Hind Siliguri font (Section 7.2).
  # Download the .ttf files into assets/fonts/ and then uncomment this:
  # fonts:
  #   - family: HindSiliguri
  #     fonts:
  #       - asset: assets/fonts/HindSiliguri-Regular.ttf
  #       - asset: assets/fonts/HindSiliguri-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/HindSiliguri-Bold.ttf
  #         weight: 700
